name: Docker

on:
  push:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'pkg/**'
      - 'Dockerfile'
      - 'config.json'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile'

env:
  GO_VERSION: '1.25'

jobs:
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: server
          push: false
          load: true
          tags: http-pg-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build proxy image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: proxy
          push: false
          load: true
          tags: http-pg-proxy:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker images
        run: |
          # Verify images were built
          docker images http-pg-server:ci
          docker images http-pg-proxy:ci
