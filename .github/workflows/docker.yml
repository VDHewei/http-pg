name: Docker

on:
  push:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'pkg/**'
      - 'Dockerfile'
      - 'config.json'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile'

jobs:
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build proxy image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: proxy
          push: false
          load: true
          tags: http-pg-proxy:ci

      - name: Build server image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: server
          push: false
          load: true
          tags: http-pg-server:ci

      - name: Test Docker images
        run: |
          docker images http-pg-server:ci
          docker images http-pg-proxy:ci
