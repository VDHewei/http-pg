name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'assets/**'
      - 'plans/**'
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.25'
  ENCRYPTION_KEY: http-pg-ci-key

jobs:
  # ──────────────────────────────────────────────────────────────
  # Code quality checks (fast, no Docker)
  # ──────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: go vet
        run: go vet ./...

  # ──────────────────────────────────────────────────────────────
  # Unit tests across platforms
  # ──────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run unit tests
        run: go test -count=1 -short ./pkg/... -v

  # ──────────────────────────────────────────────────────────────
  # Build check across platforms
  # ──────────────────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.os }}, ${{ matrix.framework }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        framework: [gin, fiber]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build server (${{ matrix.framework }})
        run: >
          go build
          ${{ matrix.framework == 'fiber' && '-tags fiber' || '' }}
          -o server${{ matrix.os == 'windows-latest' && '.exe' || '' }}
          ./cmd/server

      - name: Build proxy
        run: >
          go build
          -o proxy${{ matrix.os == 'windows-latest' && '.exe' || '' }}
          ./cmd/proxy

  # ──────────────────────────────────────────────────────────────
  # Integration tests (Docker-based, ubuntu only)
  # ──────────────────────────────────────────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, build]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Start Docker services
        run: |
          docker compose -f docker-compose.test.yml up -d
          echo "Waiting for services to be healthy..."
          # Wait for all services to be up
          for i in $(seq 1 60); do
            if curl -sf http://localhost:28080/api/v1/health > /dev/null 2>&1; then
              echo "Server is healthy after ${i}s"
              break
            fi
            sleep 2
          done

      - name: Run integration tests
        run: INTEGRATION_TEST=1 go test -tags integration -v -count=1 ./test/...

      - name: Dump Docker logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.test.yml logs --tail=100
          docker compose -f docker-compose.test.yml ps

      - name: Stop Docker services
        if: always()
        run: docker compose -f docker-compose.test.yml down --volumes

  # ──────────────────────────────────────────────────────────────
  # End-to-end tests (full proxy pipeline, ubuntu only)
  # ──────────────────────────────────────────────────────────────
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [integration-tests]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Docker services are already running (from integration-tests)

      - name: Run E2E tests (PgSQL)
        run: go test -v -count=1 -run 'TestPgSQLComprehensive' ./test/e2e/ -timeout 120s

      - name: Run E2E tests (MySQL)
        run: go test -v -count=1 -run 'TestMySQLComprehensive' ./test/e2e/ -timeout 120s

      - name: Dump Docker logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.test.yml logs --tail=100
          docker compose -f docker-compose.test.yml ps

      - name: Stop Docker services
        if: always()
        run: docker compose -f docker-compose.test.yml down --volumes
