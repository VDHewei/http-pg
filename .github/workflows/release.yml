name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  GO_VERSION: '1.25'

jobs:
  # ──────────────────────────────────────────────────────────────
  # Build and publish release
  # ──────────────────────────────────────────────────────────────
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Generate release artifacts
        run: |
          VERSION="${{ github.ref_name }}"
          LDFLAGS="-s -w -X main.version=${VERSION}"

          mkdir -p dist

          # Matrix: 2 binaries × 3 OS × 2 arch = 12 artifacts
          for binary in server proxy; do
            for os in linux darwin windows; do
              for arch in amd64 arm64; do
                ext=""
                [ "$os" = "windows" ] && ext=".exe"

                output="dist/${binary}_${os}_${arch}${ext}"
                echo "Building ${output}..."

                GOOS=$os GOARCH=$arch CGO_ENABLED=0 \
                  go build -ldflags "$LDFLAGS" -o "$output" "./cmd/${binary}"

                # Create checksum
                sha256sum "$output" >> dist/checksums.txt
              done
            done
          done

          # Also build Fiber variant for linux/amd64
          echo ""
          echo "Building server_fiber_linux_amd64..."
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
            go build -tags fiber -ldflags "$LDFLAGS" \
            -o "dist/server_fiber_linux_amd64" ./cmd/server
          sha256sum "dist/server_fiber_linux_amd64" >> dist/checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*
