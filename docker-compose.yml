version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: testdb
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    environment:
      ENCRYPTION_KEY: "http-pg-integration-test-key-2024"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["-config", "/app/config.json"]

  proxy:
    build:
      context: .
      dockerfile: Dockerfile
      target: proxy
    environment:
      ENCRYPTION_KEY: "http-pg-integration-test-key-2024"
    ports:
      - "6543:6543"
    depends_on:
      - server
    command: ["-config", "/app/config.json"]
