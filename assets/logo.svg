<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 512">
  <defs>
    <style>
      .bg { fill: #1a1a2e; }
      .text-main { font-family: 'Segoe UI', -apple-system, Arial, sans-serif; font-size: 52px; font-weight: 800; fill: #e5e7eb; letter-spacing: 14px; }
      .text-sub { font-family: 'Segoe UI', -apple-system, Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #9ca3af; letter-spacing: 8px; }
    </style>
  </defs>

  <rect class="bg" width="1024" height="512" rx="48"/>

  <!-- ══════════════════════════════════════════════════ -->
  <!-- DATA PIPELINE MARK                               -->
  <!-- ══════════════════════════════════════════════════ -->
  <g id="mark">

    <!-- ── Left: HTTP badge ── -->
    <rect x="244" y="178" width="80" height="80" rx="16" fill="#1e293b"/>
    <rect x="248" y="182" width="72" height="72" rx="12" fill="none" stroke="#3b82f6" stroke-width="2.5"/>
    <text x="284" y="228" font-family="'Segoe UI',sans-serif" font-size="18" font-weight="700" fill="#60a5fa" text-anchor="middle">HTTP</text>

    <!-- ── Arrow: HTTP → Proxy ── -->
    <line x1="332" y1="218" x2="402" y2="218" stroke="#4b5563" stroke-width="3" stroke-linecap="round"/>
    <polygon points="402,210 416,218 402,226" fill="#4b5563"/>
    <text x="374" y="200" font-family="'Segoe UI',sans-serif" font-size="10" fill="#6366f1" text-anchor="middle" font-weight="600" letter-spacing="1">AES-256</text>

    <!-- ── Center: Proxy node (hexagon) ── -->
    <polygon points="472,178 520,198 520,238 472,258 424,238 424,198" fill="#2d3748" stroke="#4a5568" stroke-width="2.5"/>
    <polygon points="472,190 506,218 472,246 438,218" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.5"/>
    <circle cx="472" cy="218" r="6" fill="#6366f1"/>

    <!-- Lock on hexagon -->
    <g transform="translate(458, 224)" opacity="0.6">
      <rect x="2" y="5" width="10" height="8" rx="1.5" fill="none" stroke="#34d399" stroke-width="2"/>
      <path d="M 4,5 L 4,1 C 4,-1 10,-1 10,1 L 10,5" fill="none" stroke="#34d399" stroke-width="2"/>
    </g>

    <!-- ── Arrow: Proxy → PG/MySQL ── -->
    <line x1="528" y1="218" x2="618" y2="218" stroke="#4b5563" stroke-width="3" stroke-linecap="round"/>
    <polygon points="618,210 632,218 618,226" fill="#4b5563"/>
    <text x="580" y="200" font-family="'Segoe UI',sans-serif" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="600" letter-spacing="1">FORWARD</text>

    <!-- ── Right: Combined PG + MySQL badge ── -->
    <rect x="640" y="164" width="80" height="100" rx="14" fill="#1e293b"/>
    <rect x="644" y="168" width="72" height="92" rx="10" fill="none" stroke="#6b7280" stroke-width="2"/>
    <text x="680" y="203" font-family="'Segoe UI',sans-serif" font-size="18" font-weight="700" fill="#fbbf24" text-anchor="middle">PG</text>
    <text x="680" y="238" font-family="'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#22d3ee" text-anchor="middle">MySQL</text>

  </g>

  <!-- ══════════════════════════════════════════════════ -->
  <!-- WORDMARK                                          -->
  <!-- ══════════════════════════════════════════════════ -->
  <g id="wordmark">
    <line x1="320" y1="315" x2="704" y2="315" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>

    <text x="512" y="380" class="text-main" text-anchor="middle">HTTP-PG</text>
    <text x="512" y="415" class="text-sub" text-anchor="middle">DATABASE PROXY</text>
  </g>
</svg>
