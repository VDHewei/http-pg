<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="db" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#336791"/>
      <stop offset="100%" stop-color="#4d94b8"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4d94b8"/>
      <stop offset="100%" stop-color="#7ec8e3"/>
    </linearGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect x="0" y="0" width="400" height="400" rx="60" fill="url(#bg)"/>

  <!-- Database cylinder - body -->
  <ellipse cx="200" cy="130" rx="80" ry="25" fill="url(#db)" opacity="0.9"/>
  <rect x="120" y="130" width="160" height="100" fill="url(#db)"/>
  <ellipse cx="200" cy="230" rx="80" ry="25" fill="#2c5870" opacity="0.8"/>
  <!-- Bottom rim highlight -->
  <ellipse cx="200" cy="230" rx="80" ry="25" fill="none" stroke="#5a9bb5" stroke-width="2"/>

  <!-- Connection arcs around the database -->
  <path d="M 90 170 Q 50 170 50 200 Q 50 230 90 230" fill="none" stroke="url(#arrow)" stroke-width="4" stroke-linecap="round"/>
  <path d="M 310 170 Q 350 170 350 200 Q 350 230 310 230" fill="none" stroke="url(#arrow)" stroke-width="4" stroke-linecap="round"/>

  <!-- Arrow heads (right side) -->
  <polygon points="88,222 100,210 100,234" fill="#7ec8e3"/>
  <polygon points="312,222 300,210 300,234" fill="#7ec8e3"/>

  <!-- Connection dots -->
  <circle cx="90" cy="175" r="4" fill="#7ec8e3"/>
  <circle cx="310" cy="175" r="4" fill="#7ec8e3"/>
  <circle cx="90" cy="225" r="4" fill="#7ec8e3"/>
  <circle cx="310" cy="225" r="4" fill="#7ec8e3"/>

  <!-- Text: HTTP-PG -->
  <text x="200" y="310" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="36" font-weight="700" letter-spacing="6" fill="#ffffff">
    HTTP-PG
  </text>

  <!-- Thin divider line -->
  <line x1="120" y1="325" x2="280" y2="325" stroke="#7ec8e3" stroke-width="0.5" opacity="0.4"/>

  <!-- Tagline -->
  <text x="200" y="350" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" letter-spacing="3" fill="#7ec8e3" opacity="0.7">
    POSTGRESQL PROXY
  </text>

  <!-- Small encryption symbol -->
  <g transform="translate(200, 40)" opacity="0.6">
    <path d="M -8 6 L -8 0 C -8 -5 8 -5 8 0 L 8 6 Z" fill="none" stroke="#7ec8e3" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="0" cy="2" r="1.5" fill="#7ec8e3"/>
  </g>
</svg>
